# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

name: $(Date:yyyy).$(Date:MM).$(Date:dd).$(Rev:r)

schedules:
- cron: "30 18 * * 1-5"
  displayName: Weekday Nightly Build
  branches:
    include:
    - main
  always: true # Runs even if there are no new code changes


pool:
  vmImage: ubuntu-latest

variables:
  phpVersion: '8.4'  

steps:
- script: |
    sudo add-apt-repository ppa:ondrej/php -y
    sudo apt-get update
    sudo apt-get install -y php$(phpVersion) php$(phpVersion)-cli php$(phpVersion)-mbstring php$(phpVersion)-xml php$(phpVersion)-zip php$(phpVersion)-curl php$(phpVersion)-mysql
  displayName: 'Install PHP 8.4 and Extensions'

- script: |
    composer install
    ./vendor/bin/phpunit --bootstrap ./vendor/autoload.php ./tests/quotetest.php
  displayName: 'Run composer'

- task: OctopusPackZip@7
  inputs:
    PackageId: 'RandomQuotes.PHP.Web'
    PackageVersion: '$(build.buildnumber)'
    SourcePath: '$(Build.SourcesDirectory)'
    OutputPath: '$(Build.ArtifactStagingDirectory)'

- task: OctopusPush@7
  inputs:
    OctoConnectedServiceName: 'samples.octopus.app'
    Space: 'Target - NGINX'
    Packages: '$(Build.ArtifactStagingDirectory)/*.zip'
    Replace: 'false'    